# Runs the test suite and the link check on every push and pull request.
# Offline: the tests use local servers and an in-memory Redis, and the
# link check resolves site links without the network. No secrets needed.
name: CI

on:
  push:
    branches-ignore:
      - live-runs
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (from the lockfile)
        run: npm ci
      - name: Tests
        run: npm test
      - name: Link check
        run: npm run check:links
